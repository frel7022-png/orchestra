name: Daily watchlist price fetch

on:
  schedule:
    # 매 평일 16:13 KST(=07:13 UTC, 장마감 30분 후) 실행.
    # 원래 정각(07:00 UTC)이었는데, GitHub 공식 문서에 "정각 예약은 전 세계적으로
    # 몰려서 특히 지연이 심하다"고 명시돼있고 실제로 2026-08-19에 2시간 넘게
    # 지연되는 걸 겪어서(예정 16:00 → 실제 18:03 KST) 애매한 분(13분)으로 옮김.
    - cron: "13 7 * * 1-5"
  workflow_dispatch: {}  # 수동 실행 버튼(테스트용)

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch watchlist prices into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python db_fetch_daily_prices.py
